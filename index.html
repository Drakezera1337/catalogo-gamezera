<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Catálogo Gamezera — Jogos de PS4</title>
<meta name="description" content="Jogos de PS4 em mídia física. Escolha os seus e faça o pedido pelo WhatsApp.">
<meta name="theme-color" content="#0b0d1f">
<meta property="og:title" content="Catálogo Gamezera — Jogos de PS4">
<meta property="og:description" content="Escolha seus jogos e faça o pedido pelo WhatsApp.">
<meta property="og:image" content="icon-512.png">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,500;0,700;0,800;1,900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0b0d1f; --bg2:#12152e; --card:#161a38; --line:#262b55;
  --txt:#eef0ff; --mut:#9aa0c8; --azul:#2f8cff; --roxo:#9b4dff; --ciano:#33d6ff;
  --verde:#25d366; --rad:14px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:radial-gradient(1200px 600px at 50% -200px,#1d2160 0%,transparent 70%),var(--bg);
  color:var(--txt);font-family:Montserrat,system-ui,sans-serif;min-height:100vh;padding-bottom:110px}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px}

/* topo */
header{text-align:center;padding:22px 0 8px}
header img{width:170px;height:auto;filter:drop-shadow(0 6px 24px rgba(80,120,255,.35))}
h1{font-weight:900;font-style:italic;font-size:clamp(26px,5vw,40px);letter-spacing:.5px;margin-top:6px;
  background:linear-gradient(90deg,var(--ciano),var(--azul) 45%,var(--roxo));-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{color:var(--mut);font-size:14px;margin-top:4px}
.sub b{color:var(--txt)}

/* barra de busca/filtros */
.ferr{position:sticky;top:0;z-index:20;background:rgba(11,13,31,.88);backdrop-filter:blur(10px);
  -webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:12px 0;margin-top:14px}
.ferr .wrap{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.busca{flex:1 1 160px;position:relative}
.busca input{width:100%;background:var(--bg2);border:1px solid var(--line);border-radius:999px;color:var(--txt);
  font:inherit;font-size:15px;padding:11px 16px 11px 40px;outline:none}
.busca input:focus{border-color:var(--azul)}
.busca svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);opacity:.6}
select{background:var(--bg2);border:1px solid var(--line);border-radius:999px;color:var(--txt);font:inherit;font-size:14px;padding:10px 14px;outline:none}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;width:100%}
.chips::-webkit-scrollbar{display:none}
.chip{white-space:nowrap;border:1px solid var(--line);background:var(--bg2);border-radius:999px;padding:7px 14px;font-size:13px;font-weight:700;color:var(--mut)}
.chip.on{background:linear-gradient(90deg,var(--azul),var(--roxo));color:#fff;border-color:transparent}

/* grade */
.info{color:var(--mut);font-size:13px;margin:16px 0 10px}
.grade{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:14px}
@media (max-width:420px){.grade{grid-template-columns:repeat(2,1fr);gap:10px}}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--rad);overflow:hidden;display:flex;flex-direction:column;
  transition:transform .15s,border-color .15s,box-shadow .15s}
.card:hover{transform:translateY(-3px);border-color:#3a43a0;box-shadow:0 10px 30px rgba(47,140,255,.15)}
.card.sel{border-color:var(--verde);box-shadow:0 0 0 1px var(--verde)}
.capa{position:relative;aspect-ratio:3/4;background:#0e1029;overflow:hidden}
.capa img{width:100%;height:100%;object-fit:cover;display:block}
.capa img.contain{object-fit:contain;padding:14px}
.selo{position:absolute;top:8px;left:8px;background:#003791;color:#fff;font-size:10px;font-weight:800;padding:3px 7px;border-radius:6px;letter-spacing:.5px}
.estq{position:absolute;top:8px;right:8px;background:rgba(0,0,0,.7);color:#fff;font-size:10px;font-weight:700;padding:3px 7px;border-radius:6px}
.check{position:absolute;inset:auto 8px 8px auto;width:30px;height:30px;border-radius:50%;background:var(--verde);display:none;place-items:center;box-shadow:0 2px 10px rgba(0,0,0,.4)}
.card.sel .check{display:grid}
.corpo{padding:10px 11px 12px;display:flex;flex-direction:column;gap:8px;flex:1}
.nome{font-size:13.5px;font-weight:700;line-height:1.3;flex:1}
.preco{font-size:19px;font-weight:800;color:var(--ciano)}
.preco.cons{font-size:15px;color:var(--mut)}
.btn{width:100%;border-radius:10px;padding:10px;font-weight:800;font-size:13px;background:linear-gradient(90deg,var(--azul),var(--roxo));color:#fff}
.btn:active{transform:scale(.98)}
.card.sel .btn{background:transparent;border:1px solid var(--verde);color:var(--verde)}
.qtdbox{display:flex;align-items:center;justify-content:space-between;border:1px solid var(--verde);border-radius:10px;overflow:hidden}
.qtdbox button{width:38px;height:38px;font-size:20px;font-weight:800;color:var(--verde)}
.qtdbox span{font-weight:800}
.vazio{text-align:center;color:var(--mut);padding:50px 0}
.status{position:absolute;left:8px;right:8px;bottom:8px;text-align:center;font-size:12px;font-weight:800;padding:6px;border-radius:8px;letter-spacing:.5px;text-transform:uppercase}
.s-vend{background:#e0244f;color:#fff}.s-res{background:#ffb020;color:#2a1a00}.s-cheg{background:var(--azul);color:#fff}
.st-vendido .capa img{filter:grayscale(1) brightness(.55)}.st-reservado .capa img{filter:brightness(.7)}
.st-vendido .preco{color:var(--mut);text-decoration:line-through}
.btn.off,.card .btn.off{background:#232850;color:var(--mut);border:0;cursor:default}

/* barra do carrinho */
.barra{position:fixed;left:0;right:0;bottom:0;z-index:30;padding:12px 16px calc(12px + env(safe-area-inset-bottom));
  background:rgba(11,13,31,.95);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid var(--line);
  transform:translateY(110%);transition:transform .25s}
.barra.on{transform:none}
.barra .wrap{display:flex;align-items:center;gap:12px;padding:0}
.barra .res{flex:1;min-width:0}
.barra .res small{color:var(--mut);font-size:12px;display:block}
.barra .res strong{font-size:20px;white-space:nowrap}
.barra .res small{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.zap{display:flex;align-items:center;gap:8px;background:var(--verde);color:#062b14;font-weight:800;border-radius:12px;padding:13px 18px;font-size:15px;white-space:nowrap}
.ver{border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-weight:700;font-size:14px;white-space:nowrap}
@media (max-width:420px){.barra .wrap{gap:8px}.barra .zap{padding:13px 12px;font-size:14px;gap:6px}.ver{padding:12px 10px;font-size:13px}.barra .res strong{font-size:18px}}

/* gaveta */
.fundo{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:40;opacity:0;pointer-events:none;transition:opacity .2s}
.fundo.on{opacity:1;pointer-events:auto}
.gaveta{position:fixed;z-index:50;left:0;right:0;bottom:0;max-height:88vh;background:var(--bg2);border-top:1px solid var(--line);
  border-radius:20px 20px 0 0;display:flex;flex-direction:column;transform:translateY(105%);transition:transform .25s;max-width:560px;margin:0 auto}
.gaveta.on{transform:none}
.gtopo{display:flex;align-items:center;justify-content:space-between;padding:16px 18px;border-bottom:1px solid var(--line)}
.gtopo h2{font-size:18px}
.fechar{font-size:26px;line-height:1;color:var(--mut);padding:0 6px}
.itens{overflow-y:auto;padding:8px 18px;flex:1}
.item{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.item img{width:46px;height:60px;object-fit:cover;border-radius:6px;background:#0e1029}
.item .n{flex:1;font-size:14px;font-weight:700}
.item .n small{display:block;color:var(--mut);font-weight:500;margin-top:2px}
.rm{color:#ff6b8a;font-size:13px;font-weight:700}
.gpe{padding:14px 18px calc(16px + env(safe-area-inset-bottom));border-top:1px solid var(--line);display:flex;flex-direction:column;gap:10px}
.gpe input{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:10px;color:var(--txt);font:inherit;font-size:15px;padding:11px 14px;outline:none}
.tot{display:flex;justify-content:space-between;font-size:18px;font-weight:800}
.gpe .zap{justify-content:center}
.obs{color:var(--mut);font-size:12px;text-align:center}

footer{text-align:center;color:var(--mut);font-size:13px;padding:34px 16px 10px;line-height:1.8}
footer a{color:var(--ciano);text-decoration:none;font-weight:700}
</style>
</head>
<body>

<header class="wrap">
  <img src="logo.png" alt="Gamezera" width="291" height="232">
  <h1>CATÁLOGO PS4</h1>
  <p class="sub">Mídia física · <b id="qtdJogos"></b> jogos disponíveis · pedido pelo WhatsApp</p>
</header>

<div class="ferr">
  <div class="wrap">
    <label class="busca">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="busca" type="search" placeholder="Buscar jogo..." autocomplete="off">
    </label>
    <select id="ordem" aria-label="Ordenar">
      <option value="pop">Mais vendidos</option>
      <option value="nome">A a Z</option>
      <option value="menor">Menor preço</option>
      <option value="maior">Maior preço</option>
    </select>
    <div class="chips" id="chips"></div>
  </div>
</div>

<main class="wrap">
  <p class="info" id="info"></p>
  <div class="grade" id="grade"></div>
</main>

<footer>
  Escolha os jogos, toque em <b>Enviar pedido</b> e finalize com a gente no WhatsApp.<br>
  <a id="lnkZap" target="_blank" rel="noopener">WhatsApp (22) 99608-4127</a> ·
  <a id="lnkInsta" target="_blank" rel="noopener">@gamezeraofc</a>
</footer>

<div class="barra" id="barra">
  <div class="wrap">
    <div class="res"><small id="barraQtd"></small><strong id="barraTot"></strong></div>
    <button class="ver" id="abrir">Ver lista</button>
    <button class="zap" id="enviar1"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2Zm5.3 14.1c-.2.6-1.3 1.2-1.8 1.2-.5.1-1 .2-3.3-.7-2.8-1.1-4.5-3.9-4.7-4.1-.1-.2-1.1-1.5-1.1-2.8s.7-2 1-2.3c.2-.3.5-.3.7-.3h.5c.2 0 .4 0 .6.5l.8 2c.1.2.1.4 0 .5l-.3.5-.4.4c-.1.1-.3.3-.1.6.2.3.8 1.3 1.7 2.1 1.2 1 2.1 1.3 2.4 1.5.3.1.5.1.6-.1l.9-1.1c.2-.3.4-.2.6-.1l1.9.9c.3.1.5.2.5.3.1.2.1.7-.1 1.3Z"/></svg>Enviar pedido</button>
  </div>
</div>

<div class="fundo" id="fundo"></div>
<aside class="gaveta" id="gaveta" aria-label="Seu pedido">
  <div class="gtopo"><h2>Seu pedido</h2><button class="fechar" id="fechar" aria-label="Fechar">×</button></div>
  <div class="itens" id="itens"></div>
  <div class="gpe">
    <input id="cliente" placeholder="Seu nome (opcional)" autocomplete="name">
    <div class="tot"><span>Total</span><span id="gTot"></span></div>
    <button class="zap" id="enviar2"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2Z"/></svg>Enviar pedido no WhatsApp</button>
    <p class="obs">Você vai conversar com a loja para combinar pagamento e entrega.</p>
  </div>
</aside>

<script>
(async function(){
  const $ = s => document.querySelector(s);
  let dados;
  try {
    const r = await fetch("jogos.json?t="+Date.now(), {cache:"no-store"});
    dados = await r.json();
  } catch(e) {
    $("#grade").innerHTML = `<p class="vazio">Não foi possível carregar o catálogo. Atualize a página.</p>`; return;
  }
  const L = dados.loja, J = dados.jogos;
  const brl = v => v.toLocaleString("pt-BR",{style:"currency",currency:"BRL",minimumFractionDigits:0});
  const porId = Object.fromEntries(J.map(j=>[j.id,j]));
  const pos = Object.fromEntries(J.map((j,i)=>[j.id,i])); // ordem do jogos.json = mais vendidos
  const esc = s => String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
  const norm = s => s.normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase();
  const st = j => j.status || "disponivel";
  const podePedir = j => st(j)==="disponivel" || st(j)==="chegando";
  const ORDEM_ST = {disponivel:0, chegando:1, reservado:2, vendido:3};
  const SELO = {chegando:["Chegando","s-cheg"], reservado:["Reservado","s-res"], vendido:["Vendido","s-vend"]};
  const capa = j => `capas/${j.id}.jpg${j.v?"?v="+j.v:""}`;

  let carrinho = {};
  try { carrinho = JSON.parse(localStorage.getItem("gz_carrinho")||"{}") || {}; } catch(e){}
  for (const id in carrinho) { const j=porId[id]; if (!j || !podePedir(j)) delete carrinho[id]; else carrinho[id]=Math.min(carrinho[id],Math.max(1,j.qtd)); }
  const salvar = () => { try{ localStorage.setItem("gz_carrinho",JSON.stringify(carrinho)); }catch(e){} };

  let faixa = "todos";
  $("#qtdJogos").textContent = J.filter(j=>st(j)==="disponivel").length;
  $("#lnkZap").href = "https://wa.me/"+L.whatsapp;
  $("#lnkInsta").href = "https://instagram.com/"+L.instagram;

  const precos = [...new Set(J.map(j=>j.preco).filter(p=>p!=null))].sort((a,b)=>a-b);
  const chips = [["todos","Todos"],["disp","Disponíveis"],...(J.some(j=>st(j)==="chegando")?[["cheg","Chegando"]]:[]),...precos.map(p=>[String(p),brl(p)])];
  $("#chips").innerHTML = chips.map(([v,t])=>`<button class="chip${v==="todos"?" on":""}" data-f="${v}">${t}</button>`).join("");
  $("#chips").addEventListener("click",e=>{
    const b=e.target.closest(".chip"); if(!b) return;
    faixa=b.dataset.f; document.querySelectorAll(".chip").forEach(c=>c.classList.toggle("on",c===b)); render();
  });

  function cardHTML(j){
    const q = carrinho[j.id]||0, s = st(j), max = Math.max(1,j.qtd);
    const preco = j.preco!=null ? `<div class="preco">${brl(j.preco)}</div>` : `<div class="preco cons">Consultar</div>`;
    let acao;
    if (s==="vendido") acao = `<button class="btn off" disabled>Vendido</button>`;
    else if (s==="reservado") acao = `<button class="btn off" disabled>Reservado</button>`;
    else if (q===0) acao = `<button class="btn" data-add="${j.id}">${s==="chegando"?"Quero reservar":"Quero este"}</button>`;
    else if (max>1) acao = `<div class="qtdbox"><button data-menos="${j.id}" aria-label="Menos">−</button><span>${q}</span><button data-mais="${j.id}" aria-label="Mais">+</button></div>`;
    else acao = `<button class="btn" data-rm="${j.id}">✓ Na lista</button>`;
    const selo = SELO[s] ? `<span class="status ${SELO[s][1]}">${SELO[s][0]}</span>` : "";
    return `<article class="card${q?" sel":""} st-${s}" data-id="${j.id}">
      <div class="capa"><img src="${capa(j)}" alt="${esc(j.nome)}" loading="lazy" onerror="this.onerror=null;this.src='icon-512.png'"${j.id==="minecraft"?' class="contain"':""}>
        <span class="selo">PS4</span>${s==="disponivel"&&j.qtd>1?`<span class="estq">${j.qtd} unidades</span>`:""}${selo}
        <span class="check"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#062b14" stroke-width="3.5"><path d="m5 12 5 5 9-10"/></svg></span></div>
      <div class="corpo"><div class="nome">${esc(j.nome)}</div>${preco}${acao}</div></article>`;
  }

  function lista(){
    const t = norm($("#busca").value.trim()), o=$("#ordem").value;
    let r = J.filter(j => (!t || norm(j.nome).includes(t)) &&
      (faixa==="todos" || (faixa==="disp" ? st(j)==="disponivel" : faixa==="cheg" ? st(j)==="chegando" : String(j.preco)===faixa)));
    const pv = j => j.preco==null ? (o==="menor"?1e9:-1) : j.preco;
    r.sort((a,b)=> (ORDEM_ST[st(a)]??0)-(ORDEM_ST[st(b)]??0) || (o==="menor" ? pv(a)-pv(b) : o==="maior" ? pv(b)-pv(a) : o==="pop" ? pos[a.id]-pos[b.id] : 0) || a.nome.localeCompare(b.nome));
    return r;
  }

  function render(){
    const r = lista();
    $("#grade").innerHTML = r.length ? r.map(cardHTML).join("") : `<p class="vazio">Nenhum jogo encontrado.</p>`;
    $("#info").textContent = r.length===J.length ? `${J.length} jogos` : `${r.length} de ${J.length} jogos`;
    renderCarrinho();
  }

  function itensCarrinho(){ return Object.entries(carrinho).filter(([,q])=>q>0).map(([id,q])=>({j:porId[id],q})); }
  function totais(){
    const it=itensCarrinho(); let un=0,tot=0,cons=false;
    it.forEach(({j,q})=>{un+=q; if(j.preco==null) cons=true; else tot+=j.preco*q;});
    return {it,un,tot,cons};
  }

  function renderCarrinho(){
    const {it,un,tot,cons}=totais();
    $("#barra").classList.toggle("on",un>0);
    $("#barraQtd").textContent = `${un} ${un===1?"jogo":"jogos"}${cons?" + consultar":""}`;
    $("#barraTot").textContent = brl(tot);
    $("#gTot").textContent = brl(tot)+(cons?" + consultar":"");
    $("#itens").innerHTML = it.length ? it.map(({j,q})=>`<div class="item"><img src="${capa(j)}" alt="">
      <div class="n">${esc(j.nome)}<small>${q>1?q+" × ":""}${j.preco!=null?brl(j.preco):"Consultar"}${st(j)==="chegando"?" · reposição a caminho":""}</small></div>
      <button class="rm" data-rm="${j.id}">Remover</button></div>`).join("") : `<p class="vazio">Nenhum jogo escolhido ainda.</p>`;
    if(!it.length) fecharGaveta();
  }

  function mudar(id,d){
    const j=porId[id]; const q=Math.max(0,Math.min(Math.max(1,j.qtd),(carrinho[id]||0)+d));
    if(q) carrinho[id]=q; else delete carrinho[id];
    salvar();
    const card=document.querySelector(`.card[data-id="${id}"]`);
    if(card) card.outerHTML=cardHTML(j);
    renderCarrinho();
  }

  document.addEventListener("click",e=>{
    const b=e.target.closest("[data-add],[data-rm],[data-mais],[data-menos]"); if(!b) return;
    if(b.dataset.add) mudar(b.dataset.add,1);
    else if(b.dataset.mais) mudar(b.dataset.mais,1);
    else if(b.dataset.menos) mudar(b.dataset.menos,-1);
    else if(b.dataset.rm) mudar(b.dataset.rm,-99);
  });

  function abrirGaveta(){ $("#gaveta").classList.add("on"); $("#fundo").classList.add("on"); }
  function fecharGaveta(){ $("#gaveta").classList.remove("on"); $("#fundo").classList.remove("on"); }
  $("#abrir").onclick=abrirGaveta; $("#fechar").onclick=fecharGaveta; $("#fundo").onclick=fecharGaveta;

  function enviar(){
    const {it,tot,cons}=totais(); if(!it.length) return;
    const nome=$("#cliente").value.trim();
    let m = `Olá, Gamezera! ${nome?`Sou ${nome} e `:""}quero estes jogos do catálogo:\n\n`;
    it.forEach(({j,q})=>{ m+=`• ${q>1?q+"x ":""}${j.nome} — ${j.preco!=null?brl(j.preco*q):"consultar"}${st(j)==="chegando"?" (reserva, reposição a caminho)":""}\n`; });
    m += `\n*Total: ${brl(tot)}${cons?" + jogo(s) a consultar":""}*`;
    window.open("https://wa.me/"+L.whatsapp+"?text="+encodeURIComponent(m),"_blank");
  }
  $("#enviar1").onclick=enviar; $("#enviar2").onclick=enviar;

  $("#busca").addEventListener("input",render);
  $("#ordem").addEventListener("change",render);
  render();
})();
</script>
</body>
</html>
